name: n8n keepalive (Mi Dia Nutricional)

# Vigila que el workflow de sync de n8n siga ACTIVO (n8n lo desactiva solo cuando su
# instancia se reinicia por falta de RAM). Corre en GitHub, afuera de n8n, asi que
# funciona aunque la instancia se haya caido.
#
# 2026-08-07 — Reescrito. Dos problemas encontrados:
#  (1) Dos runs quedaron colgados 15 MIN y GitHub los cancelo -> mail de error por un
#      hipo de n8n. Los curl no tenian --max-time. Los runs sanos tardan 6-15 SEGUNDOS.
#  (2) MAS GRAVE: el secret N8N_API_KEY nunca existio, asi que el script salia por
#      "exit 0" silencioso. Los ~98 runs "success" no chequeaban NADA: el keepalive
#      era decorativo.
#
# Diseno nuevo, en dos niveles:
#  NIVEL 1 (siempre, sin API key): un GET al webhook dice si el sync esta activo, porque
#          n8n responde distinto segun el caso, y NO ejecuta el workflow (no gasta cuota):
#            activo  -> "This webhook is not registered for GET requests..."
#            caido   -> "The requested webhook ... is not registered"
#  NIVEL 2 (solo si esta cargado el secret N8N_API_KEY): si esta caido, lo reactiva solo.
#
# Cuando manda mail: SOLO si el sync esta caido y no se pudo reactivar (ahi Gaston tiene
# que hacer algo). Un n8n lento o un timeout de red = warning, sin mail.

on:
  schedule:
    - cron: '*/15 * * * *'   # cada 15 minutos (UTC)
  workflow_dispatch: {}       # y a mano desde la pestania Actions

concurrency:
  group: keepalive-n8n
  cancel-in-progress: false   # si uno tarda, el siguiente espera (no se cancelan entre si)

jobs:
  reactivar:
    runs-on: ubuntu-latest
    timeout-minutes: 4        # red de seguridad: nunca mas colgado 15 minutos
    steps:
      - name: Vigilar (y reactivar) el sync de Mi Dia Nutricional
        env:
          N8N_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          set -uo pipefail

          BASE="https://ecddaniele.app.n8n.cloud"
          WID="TQDi7FTn8YUU1YYR"
          HOOK="$BASE/webhook/mdn-sync"
          CURL=(curl -sS --connect-timeout 10 --max-time 25)

          # ── NIVEL 1: ¿esta activo? (sin API key, sin gastar cuota de n8n) ──
          estado() {
            local cuerpo
            cuerpo=$("${CURL[@]}" "$HOOK" 2>/dev/null) || { echo "SIN_RESPUESTA"; return; }
            if   echo "$cuerpo" | grep -q "not registered for GET"; then echo "ACTIVO"
            elif echo "$cuerpo" | grep -q "is not registered";      then echo "CAIDO"
            else echo "RARO: $(echo "$cuerpo" | head -c 200)"
            fi
          }

          EST=""
          for i in 1 2 3; do
            EST=$(estado)
            case "$EST" in ACTIVO|CAIDO) break ;; esac
            echo "Intento $i: $EST"
            [ $i -lt 3 ] && sleep $((i * 10))
          done

          if [ "$EST" = "ACTIVO" ]; then
            echo "Sync ACTIVO. Nada que hacer."
            exit 0
          fi

          if [ "$EST" != "CAIDO" ]; then
            # n8n no contesta o contesta algo inesperado: no es accionable, reintenta solo
            echo "::warning::n8n no respondio como se esperaba tras 3 intentos ($EST). Reintento en el proximo run."
            exit 0
          fi

          # ── NIVEL 2: esta CAIDO -> intentar reactivarlo (necesita la API key) ──
          echo "Sync CAIDO."
          if [ -z "${N8N_KEY:-}" ]; then
            echo "::error::El sync de Mi Dia Nutricional esta CAIDO y no hay API key para reactivarlo."
            echo "Arreglo a mano: entra a https://ecddaniele.app.n8n.cloud y prende el workflow 'Mi Dia Nutricional - Sync'."
            echo "Para que se arregle solo: n8n -> Settings -> API -> crear API key, y cargala en"
            echo "GitHub -> Settings -> Secrets and variables -> Actions -> New secret, con el nombre N8N_API_KEY."
            exit 1
          fi

          echo "Reactivando con la API..."
          ACT=$("${CURL[@]}" -o /dev/null -w '%{http_code}' -X POST \
                -H "X-N8N-API-KEY: $N8N_KEY" "$BASE/api/v1/workflows/$WID/activate" 2>/dev/null || echo 000)
          echo "activate -> HTTP $ACT"

          case "$ACT" in
            401|403)
              echo "::error::n8n rechazo la API key (HTTP $ACT). Renovala en n8n y actualiza el secret N8N_API_KEY."
              exit 1 ;;
            404)
              echo "::error::n8n no encuentra el workflow $WID (HTTP 404). Revisa el ID."
              exit 1 ;;
          esac

          # Verificar de verdad que quedo activo (que la API diga 200 no alcanza)
          sleep 5
          VER=$(estado)
          if [ "$VER" = "ACTIVO" ]; then
            echo "OK: el sync volvio a estar ACTIVO."
          else
            echo "::error::Se pidio la reactivacion (HTTP $ACT) pero el sync sigue caido ($VER)."
            echo "Entra a https://ecddaniele.app.n8n.cloud y prendelo a mano."
            exit 1
          fi
